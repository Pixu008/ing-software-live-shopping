<!-- LOGIN -->
        <div class="row justify-content-center" id="pantallaLogin">
            <div class="col-md-5">
                <div class="card shadow">
                    <div class="card-header bg-dark text-white text-center"><strong>Iniciar Sesión</strong></div>
                    <div class="card-body">
                        <div id="alertaLogin" class="alert alert-danger d-none py-2 small"></div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Correo</label>
                            <input type="email" id="loginCorreo" class="form-control" value="admin@live.cl">
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Contraseña</label>
                            <input type="password" id="loginPassword" class="form-control" value="1234">
                        </div>
                        <button class="btn btn-primary w-100 fw-bold mb-3" onclick="iniciarSesion()">Entrar al Sistema</button>
                        <div class="text-center">
                            <button class="btn btn-link btn-sm text-decoration-none" onclick="mostrarRegistro()">¿Usuario nuevo? Crear cuenta aquí</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- REGISTRO DE USUARIO (NUEVO) -->
        <div class="row justify-content-center d-none" id="pantallaRegistro">
            <div class="col-md-5">
                <div class="card shadow border-primary">
                    <div class="card-header bg-primary text-white text-center"><strong>Registrar Nuevo Usuario</strong></div>
                    <div class="card-body">
                        <div id="alertaRegistro" class="alert d-none py-2 small"></div>
                        <div class="mb-2">
                            <label class="form-label small fw-bold">Nombre Completo</label>
                            <input type="text" id="regNombre" class="form-control" placeholder="Ej: Cristóbal Pérez">
                        </div>
                        <div class="mb-2">
                            <label class="form-label small fw-bold">Correo Electrónico</label>
                            <input type="email" id="regCorreo" class="form-control" placeholder="ejemplo@live.cl">
                        </div>
                        <div class="mb-2">
                            <label class="form-label small fw-bold">Contraseña Segura</label>
                            <input type="password" id="regPassword" class="form-control" placeholder="Ej: Clave123!">
                            <div class="form-text" style="font-size: 0.78em;">
                                Mínimo 8 caracteres: mayúsculas, minúsculas, números y símbolos.
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Rol</label>
                            <select id="regRol" class="form-select">
                                <option value="asistente">Asistente</option>
                                <option value="administrador">Administrador</option>
                            </select>
                        </div>
                        <button class="btn btn-success w-100 fw-bold mb-2" onclick="registrarUsuario()">Crear Cuenta</button>
                        <div class="text-center">
                            <button class="btn btn-link btn-sm text-decoration-none" onclick="mostrarLogin()">Volver al Inicio de Sesión</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
